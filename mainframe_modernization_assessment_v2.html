function viz(id){let svg='',cap='';const box=(x,y,w,h,label,fill='#e8f0f3',stroke='#9db2bf')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${fill}" stroke="${stroke}"/><text x="${x+w/2}" y="${y+h/2+4}" text-anchor="middle" font-size="12" fill="#25404d">${label}</text>`;const arrow=(x,y,x2,y2,dash='')=>`<path d="M${x} ${y}L${x2} ${y2}" fill="none" stroke="#8096a2" stroke-width="1.6" ${dash?'stroke-dasharray="5 4"':''} marker-end="url(#ar)"/>`;if(id==='conc'){svg=box(16,12,160,32,'Debit A: 2,000')+box(224,12,160,32,'Debit B: 3,000')+arrow(96,44,96,67)+arrow(304,44,304,67)+box(16,69,160,32,'Read 10,000')+box(224,69,160,32,'Read 10,000')+arrow(96,101,96,124)+arrow(304,101,304,124)+box(16,126,160,32,'Write 8,000','#fbe8e8','#d08a90')+box(224,126,160,32,'Write 7,000','#fbe8e8','#d08a90')+`<text x="200" y="183" text-anchor="middle" font-size="12" fill="#a82739">Expected 5,000 · possible 7,000 if locking is lost</text>`;cap='Hypothetical target interleaving if lock lifetime is not preserved. The legacy source requests a lock; this is not a proven legacy race.'}else if(id==='txn'){svg=box(10,27,112,36,'Balance update')+arrow(122,45,143,45)+box(145,27,110,36,'Ledger insert')+arrow(255,45,276,45)+box(278,27,112,36,'Commit','#e2f2e9','#83b5a5')+`<rect x="4" y="10" width="393" height="68" rx="8" fill="none" stroke="#709e9b" stroke-dasharray="5 3"/><text x="200" y="97" text-anchor="middle" font-size="12" fill="#426d6c">Candidate atomic unit</text>`+arrow(334,63,334,127)+box(259,129,130,36,'Queue write','#fff0e1','#d4a477')+`<text x="240" y="116" font-size="11" fill="#a64e18">Crash window</text>`;cap='Observed statement order in PAYMENT; actual resource enlistment and queue recovery need confirmation.'}else if(id==='data'){svg=box(10,16,380,30,'CUST-BODY · 60 bytes')+arrow(200,46,100,75)+arrow(200,46,300,75)+box(10,77,180,36,'PERSONAL layout')+box(210,77,180,36,'CORPORATE layout')+box(10,127,114,34,'Name · 40')+box(124,127,66,34,'Tax · 20','#fff0e1','#d4a477')+box(210,127,125,34,'Name · 45')+box(335,127,55,34,'Reg · 15')+`<text x="200" y="183" text-anchor="middle" font-size="11" fill="#607284">CUST-KIND selects the interpretation; preserve original byte layout.</text>`;cap='REDEFINES overlays the same bytes. A relational redesign must not assume both layouts exist independently.'}else if(id==='perf'||id==='batch'){svg=box(9,14,120,35,'Fetch row')+arrow(129,31,139,31)+box(141,14,118,35,'2 SQL updates')+arrow(259,31,270,31)+box(272,14,118,35,'Commit')+`<path d="M331 49 V73 H69 V51" fill="none" stroke="#8096a2" marker-end="url(#ar)"/><text x="200" y="91" text-anchor="middle" font-size="12" fill="#607284">Repeat per payment</text>`+box(10,116,380,38,'Candidate: bounded partitions or set-based writes','#e2f2e9','#83b5a5');cap='Static loop structure indicates a candidate bottleneck; production volumes, ordering and recovery constraints must be measured.'}else if(id==='arch'||id==='deploy'){svg=box(10,14,380,35,'Mainframe payment + account core')+arrow(100,49,100,79)+arrow(300,49,300,79)+box(10,81,180,40,'Interest · pure calculation','#e2f2e9','#83b5a5')+box(210,81,180,40,'Reporting · read-only','#e2f2e9','#83b5a5')+`<path d="M5 70H395" stroke="#8aa8a5" stroke-dasharray="5 3"/><text x="200" y="145" text-anchor="middle" font-size="12" fill="#426d6c">Candidate early migration boundaries</text>`;cap='Conceptual target split. Validate production callers and data freshness before authorizing separation.'}else{return ''}return `<div class="visual"><svg viewBox="0 0 400 193" role="img" aria-label="${esc(topic(id).name)} engineering diagram"><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#8096a2"/></marker></defs>${svg}</svg><div class="caption">${cap}</div></div>`}
function card(f,open=false,fromFile=''){let a=affected(f),show=open||expanded.has(f.id);return `<article class="finding" id="card-${f.id}"><div class="findinghead" data-toggle="${f.id}" role="button" tabindex="0" aria-expanded="${show}"><div class="grow"><div class="row">${badge(f.severity)}${badge(f.kind)}<span class="small">${f.id} · ${esc(topic(f.topic).name)}</span></div><h3>${esc(f.title)}</h3><p>${esc(f.obs)}</p><p>${a.length} affected file${a.length===1?'':'s'} · ${a.map(esc).join(', ')}</p></div><span class="chevron">${show?'−':'+'}</span></div><div class="findingbody" ${show?'':'hidden'}><div class="explain"><div><h4>Observed behavior</h4><p>${esc(f.obs)}</p></div><div><h4>Modernization failure mode</h4><p>${esc(f.risk)}</p></div><div class="action"><h4>Recommended action</h4><p>${esc(f.action)}</p></div><div><h4>Acceptance criteria</h4><p>${esc(f.test)}</p></div></div><div class="evtitle">Source evidence · click to inspect</div>${f.evidence.map(e=>`<button class="evidence-line" data-file="${esc(e.file)}" data-line="${e.start}" data-finding="${f.id}"><strong>${esc(e.file)} : ${e.start}</strong><code>${esc(e.text)}</code><span class="arrow">↗</span></button>`).join('')}${f.request?`<div class="request"><strong>Evidence needed:</strong> ${esc(f.request)} ${received.has(f.id)?'<em>· marked received (not verified)</em>':''}</div>`:''}<div class="research"><strong>Why assess this?</strong> ${esc(f.why)}<div>${f.refs.map(r=>`<a href="${esc(refs[r].url)}" target="_blank" rel="noopener">${r} · ${esc(refs[r].title)} ↗</a>`).join('')}</div></div></div></article>`}
function filterHTML(){return `<div class="controls"><input id="q" placeholder="Search findings…" value="${esc(query)}" aria-label="Search findings"><select id="sev" aria-label="Severity">${['All','Critical','High','Medium','Low','Unrated'].map(s=>`<option ${severity===s?'selected':''} value="${s}">${s==='All'?'All severities':s}</option>`).join('')}</select><div class="categorytabs">${['All','Hazard','Opportunity','Gap'].map(k=>`<button class="${kind===k?'active':''}" data-kind="${k}">${k==='All'?'All':k==='Gap'?'Gaps':k==='Opportunity'?'Opportunities':k+'s'}</button>`).join('')}</div></div>`}function matches(f){return (kind==='All'||f.kind===kind)&&(severity==='All'||f.severity===severity)&&(!query||JSON.stringify(f).toLowerCase().includes(query.toLowerCase()))}function topicResults(){let a=F.filter(f=>(currentTopic==='all'||f.topic===currentTopic)&&matches(f));return `<div class="row spread" style="margin:4px 0 9px"><span class="small">${a.length} matching findings</span><button class="link" data-expand="1">Expand all</button></div>${a.length?a.map((f,i)=>card(f,expanded.has(f.id))).join(''):'<div class="empty">No findings match these filters.</div>'}`}

function fileRows(){let q=query.toLowerCase();let a=files.filter(f=>!q||[f.name,f.role,f.strategy,...findingsOf(f.name).map(x=>x.title)].join(' ').toLowerCase().includes(q));return a.length?a.map(f=>{let arr=findingsOf(f.name),cr=arr.filter(x=>x.severity==='Critical').length,hi=arr.filter(x=>x.severity==='High').length;return `<tr><td><button class="link filename" data-file="${f.name}">${f.name}</button><span class="small">${f.name.endsWith('.cpy')?'Copybook':'COBOL program'} · ${f.code.length} lines</span></td><td>${esc(f.role)}</td><td>${arr.length}<span class="small">${counts(arr,'Hazard')} hazards · ${counts(arr,'Opportunity')} opp.</span></td><td style="min-width:100px">${cr?badge('Critical'):hi?badge('High'):badge('Medium')}<div style="margin-top:6px">${bar(arr)}</div></td><td>${esc(f.strategy)}</td><td><button class="btn" data-file="${f.name}">Inspect →</button></td></tr>`}).join(''):'<tr><td colspan="6">No matching files.</td></tr>'}function filesPage(){return head('Codebase / inventory','File explorer','Inspect all 10 files, their associated engineering findings and recommended modernization actions.')+`<div class="controls"><input id="fileq" placeholder="Search by file, responsibility or finding…" value="${esc(query)}" aria-label="Search files"><span class="tablecount">7 COBOL · 3 copybooks</span></div><div class="tablewrap"><table><thead><tr><th>Source file</th><th>Responsibility</th><th>Findings</th><th>Highest severity</th><th>Proposed disposition</th><th></th></tr></thead><tbody id="fileRows">${fileRows()}</tbody></table></div><div class="assessment-note">A cross-file finding appears in every implicated file, but is counted once in the engineering assessment. Counts indicate exposure, not an effort estimate.</div>`+footer()}

const graphEdges=[['DISPATCH.cbl','PAYMENT.cbl','LINK'],['DISPATCH.cbl','FEEEXT','candidate LINK'],['PAYMENT.cbl','ACCOUNT.cbl','CALL'],['PAYMENT.cbl','PAYMENT_LEDGER','INSERT'],['PAYMENT.cbl','PAYN queue','WRITEQ'],['ACCOUNT.cbl','ACCOUNTS','UPDATE'],['SETTLEMENT.cbl','ACCOUNTS','UPDATE'],['SETTLEMENT.cbl','PAYMENT_LEDGER','READ / WRITE'],['REPORT.cbl','ACCOUNTS','READ'],['CUSTOMER.cbl','CUSTOMR VSAM','READ']];function graph(){let nodes={'DISPATCH.cbl':[12,12],'PAYMENT.cbl':[12,93],'ACCOUNT.cbl':[208,93],'SETTLEMENT.cbl':[208,203],'REPORT.cbl':[208,313],'CUSTOMER.cbl':[12,313],'FEEEXT':[208,12],'ACCOUNTS':[425,250],'PAYMENT_LEDGER':[425,145],'PAYN queue':[425,12],'CUSTOMR VSAM':[425,350],'INTEREST.cbl':[12,203]};let paths=graphEdges.map(([a,b,t])=>{let [x,y]=nodes[a],[u,v]=nodes[b];return `<path d="M${x+140} ${y+20} C${(x+140+u)/2} ${y+20},${(x+140+u)/2} ${v+20},${u} ${v+20}" fill="none" stroke="${b==='FEEEXT'?'#bd7a46':'#9db0bc'}" stroke-width="1.5" ${b==='FEEEXT'?'stroke-dasharray="4 3"':''} marker-end="url(#garr)"/>`}).join('');let ns=Object.entries(nodes).map(([n,[x,y]])=>{let known=!!file(n),gap=n==='FEEEXT';return `<g class="${known?'gnode':''}" ${known?`data-file="${n}" role="button" tabindex="0" aria-label="Inspect ${n}"`:''}><rect x="${x}" y="${y}" width="140" height="40" rx="6" fill="${gap?'#fff1e3':known?'#e8f2f3':'#edf0f5'}" stroke="${gap?'#bd7a46':known?'#9ebdc0':'#a9b6c4'}" ${gap?'stroke-dasharray="4 3"':''}/><text x="${x+70}" y="${y+17}" text-anchor="middle" font-size="11" font-weight="600" fill="#25404d">${n}</text><text x="${x+70}" y="${y+30}" text-anchor="middle" font-size="9" fill="#607284">${gap?'Unresolved target':known?'Source program':'External resource'}</text></g>`}).join('');return head('Codebase / dependency analysis','Dependency map','See program calls and shared data resources. Copybook relationships are listed separately to keep the graph readable.')+`<div class="panel"><div class="row spread"><h3>Program and resource graph</h3><span class="small">Click a source node</span></div><div class="graphbox" style="margin-top:12px"><svg viewBox="0 0 580 405" role="img" aria-label="Program and resource dependency graph"><defs><marker id="garr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L5 3L0 6Z" fill="#8096a2"/></marker></defs>${paths}${ns}</svg></div><div class="legend"><span>● Source program</span><span>◻ External resource</span><span style="color:#a64e18">┄ Unresolved candidate</span></div><div class="assessment-note">FEEEXT is an unresolved candidate call destination, not necessarily an omitted source file. The other external nodes are known referenced resource names; their operational configuration is unverified.</div></div>${section('Relationship inventory')}<div class="tablewrap"><table><thead><tr><th>Source</th><th>Target</th><th>Relationship</th><th>Status</th></tr></thead><tbody>${graphEdges.map(([a,b,t])=>`<tr><td>${fileLink(a)}</td><td>${file(b)?fileLink(b):esc(b)}</td><td>${esc(t)}</td><td>${b==='FEEEXT'?badge('Unrated'):file(b)?'Source present':'Resource referenced'}</td></tr>`).join('')}</tbody></table></div>${section('Copybook consumers')}<div class="grid3">${files.filter(f=>f.name.endsWith('.cpy')).map(f=>{let consumers=files.filter(p=>p.name.endsWith('.cbl')&&p.code.some(l=>l.includes('COPY '+f.name.split('.')[0]+'.')));return `<div class="panel"><h3>${fileLink(f.name)}</h3><p class="small">${consumers.length} consumers</p><div class="divider"></div>${consumers.map(p=>`<p style="margin:5px 0">${fileLink(p.name)}</p>`).join('')}</div>`}).join('')}</div>`+footer()}
function evidence(){let a=F.filter(f=>f.request).sort((x,y)=>Number(received.has(x.id))-Number(received.has(y.id))||(['Critical','High','Medium','Low','Unrated'].indexOf(x.severity)-['Critical','High','Medium','Low','Unrated'].indexOf(y.severity)));return head('Evidence / investigation','Evidence requests','Collect the information that changes modernization decisions. Missing evidence is tracked separately from the technical hazards it qualifies.')+`<div class="grid3"><div class="kpi"><span>Open requests</span><strong>${a.length-received.size}</strong></div><div class="kpi"><span>Marked received</span><strong>${received.size}</strong><small>Still require verification</small></div><div class="kpi"><span>Standalone gaps</span><strong>${counts(F,'Gap')}</strong></div></div><div class="assessment-note">Marking evidence received is a demonstration of workflow state only. It does not resolve a finding, change risk or validate uploaded artifacts.</div>${a.map(f=>`<div class="panel" style="margin:10px 0"><div class="row spread"><div class="row">${badge(f.severity)}<span class="small">${f.id} · ${esc(topic(f.topic).name)}</span></div><button class="btn ${received.has(f.id)?'':'primary'}" data-receive="${f.id}">${received.has(f.id)?'Mark open':'Mark received'}</button></div><h3 style="margin:8px 0">${esc(f.title)}</h3><p><strong>Request:</strong> ${esc(f.request)}</p><p class="small" style="margin-top:7px"><strong>Decision impact:</strong> ${esc(f.risk)}</p><div class="row" style="margin-top:8px"><button class="link" data-open="${f.id}">Inspect finding →</button>${affected(f).map(n=>fileLink(n)).join(' · ')}</div></div>`).join('')}`+footer()}
const scenarios={incremental:{title:'Incremental',desc:'Extract interest and reporting; keep the payment core.',move:['INTEREST.cbl','REPORT.cbl'],retain:['PAYMENT.cbl','ACCOUNT.cbl','SETTLEMENT.cbl','DISPATCH.cbl','CUSTOMER.cbl'],gates:['F03','F16','F31','F34'],notes:'Preferred illustrative starting point: smallest change to write ownership.'},replatform:{title:'Replatform together',desc:'Preserve COBOL and current data boundaries on a compatible runtime.',move:files.filter(f=>f.name.endsWith('.cbl')).map(f=>f.name),retain:[],gates:['F04','F05','F08','F11','F14','F23','F32'],notes:'Conditional alternative: requires runtime compatibility, operational metrics and verified platform replacements.'},rewrite:{title:'Full rewrite',desc:'Replace all seven programs with modern components and storage.',move:files.filter(f=>f.name.endsWith('.cbl')).map(f=>f.name),retain:[],gates:['F08','F11','F12','F13','F14','F20','F24','F31','F33'],notes:'Higher exposure: transaction redesign, data migration and cutover require evidence and validation.'}};function strategy(){let s=scenarios[scenario];return head('Decision / modernization roadmap','Migration strategy','Compare dispositions and prerequisite gates. These are illustrative candidate plans, not approved production architectures.')+`<div class="strategy">${Object.entries(scenarios).map(([k,x])=>`<button data-scenario="${k}" class="${scenario===k?'active':''}"><div class="eyebrow">${scenario===k?'Selected':'Alternative'}</div><h3>${x.title}</h3><p>${x.desc}</p></button>`).join('')}</div><div class="assessment-note">${esc(s.notes)} Copybooks migrate as versioned contracts with their consumers rather than as executable units.</div><div class="grid2"><div class="panel"><h3>Candidate placement</h3><div class="divider"></div><div class="grid2"><div><h4>Move / transform</h4>${s.move.map(n=>`<p style="margin:8px 0">${fileLink(n)}</p>`).join('')}</div><div><h4>Retain on mainframe</h4>${s.retain.length?s.retain.map(n=>`<p style="margin:8px 0">${fileLink(n)}</p>`).join(''):'<p class="small">None in final target; coexistence still required.</p>'}</div></div></div><div class="panel"><h3>Selected prerequisite findings</h3><p class="small">Illustrative priority subset, not exhaustive.</p><div style="margin-top:10px">${s.gates.map(id=>F.find(f=>f.id===id)).filter(Boolean).map(issue).join('')}</div></div></div>${section('Proposed migration waves','Acceptance gates must be satisfied before each move')}<div class="panel">${[['Resolve runtime contracts','Confirm resource enlistment, locking, FEEEXT, queue behavior and workload evidence.','Gate: required runtime facts reviewed and recorded.'],['Pilot isolated behavior','Extract interest and compare shadow reports without changing payment ownership.','Gate: exact financial parity and acceptable report freshness.'],['Decouple platform interfaces','Replace terminal entry points and isolate customer storage behind stable interfaces.','Gate: validated error, identity and data contracts.'],['Address transactional core','Preserve one authoritative writer; benchmark and validate settlement restart and atomicity.','Gate: concurrency, failure injection and reconciliation pass.'],['Controlled cutover','Run isolated comparison, reconcile state, rehearse rollback and confirm operator readiness.','Gate: approved cutover, rollback and acceptance plan.']].map(([t,d,g],i)=>`<div class="wave"><div class="step">${i+1}</div><div><h3>${t}</h3><p>${d}</p><strong style="font-size:12px;color:var(--accent)">${g}</strong></div></div>`).join('')}</div>`+footer()}
function research(){return head('Methodology / references','Research library','Published research, industry guidance and migration experiences that motivate the assessment questions. Findings in this prototype are independently constructed examples.')+Object.entries(refs).map(([id,r])=>`<div class="refcard"><div class="row spread"><span class="small">${id} · ${esc(r.type)} ${r.year?'· '+esc(r.year):''}</span><span class="pill">${F.filter(f=>f.refs.includes(id)).length} findings</span></div><h3 style="margin:5px 0"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)} ↗</a></h3><p>${esc(r.description)}</p></div>`).join('')+footer()}
function render(scroll=true){$('nav').innerHTML=navHTML();$('mobileNav').innerHTML=navHTML();$('breadcrumb').textContent=nav.find(x=>x[0]===view)?.[1]||'File detail';$('content').innerHTML=({overview,topics,files:filesPage,detail:fileDetail,graph,evidence,strategy,research}[view]||overview)();if(scroll)window.scrollTo(0,0);if(view==='detail'&&focusLine){requestAnimationFrame(()=>{let l=$('line-'+focusLine), sc=$('sourcecode');if(l&&sc)sc.scrollTop=Math.max(0,l.offsetTop-sc.offsetTop-sc.clientHeight/2)})}}function resetFilters(){query='';kind='All';severity='All';expanded.clear()}function go(v){view=v;resetFilters();if(v==='topics')currentTopic='conc';render()}function openFinding(id){let f=F.find(x=>x.id===id);if(!f)return;view='topics';currentTopic=f.topic;resetFilters();expanded.add(id);render();requestAnimationFrame(()=>{let el=$('card-'+id);el?.scrollIntoView({block:'start'});el?.querySelector('.findinghead')?.focus({preventScroll:true})})}function openFile(n,line=0,id=''){if(!file(n))return;view='detail';currentFile=n;focusLine=Number(line);focusFinding=id;resetFilters();if(id)expanded.add(id);render();if(id)requestAnimationFrame(()=>{$('card-'+id)?.scrollIntoView({block:'nearest'})})}document.addEventListener('click',e=>{let b=e.target.closest('[data-view],[data-topic],[data-file],[data-open],[data-toggle],[data-kind],[data-kindnav],[data-critical],[data-expand],[data-scenario],[data-receive]');if(!b)return;let d=b.dataset;if(d.view){go(d.view)}else if(d.topic){view='topics';currentTopic=d.topic;resetFilters();render()}else if(d.file){openFile(d.file,d.line,d.finding||'')}else if(d.open){openFinding(d.open)}else if(d.toggle){let id=d.toggle,body=$('card-'+id).querySelector('.findingbody'),open=body.hidden;if(open)expanded.add(id);else expanded.delete(id);if(!open&&focusFinding===id)focusFinding='';body.hidden=!open;b.setAttribute('aria-expanded',open);b.querySelector('.chevron').textContent=open?'−':'+'}else if(d.kind){kind=d.kind;render(false)}else if(d.kindnav){view='topics';currentTopic='all';resetFilters();kind=d.kindnav;render()}else if(d.critical){view='topics';currentTopic='all';resetFilters();severity='Critical';render()}else if(d.expand){let items=[...document.querySelectorAll('.findinghead')],open=items.some(x=>x.getAttribute('aria-expanded')==='false');items.forEach(x=>{let id=x.dataset.toggle,body=$('card-'+id).querySelector('.findingbody');if(open)expanded.add(id);else expanded.delete(id);body.hidden=!open;x.setAttribute('aria-expanded',open);x.querySelector('.chevron').textContent=open?'−':'+'});b.textContent=open?'Collapse all':'Expand all'}else if(d.scenario){scenario=d.scenario;render(false)}else if(d.receive){received.has(d.receive)?received.delete(d.receive):received.add(d.receive);render(false)}});document.addEventListener('input',e=>{if(e.target.id==='q'){query=e.target.value;$('results').innerHTML=topicResults()}if(e.target.id==='fileq'){query=e.target.value;$('fileRows').innerHTML=fileRows()}});document.addEventListener('change',e=>{if(e.target.id==='sev'){severity=e.target.value;$('results').innerHTML=topicResults()}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"]')){e.preventDefault();e.target.click()}});render();
</script></body></html>
