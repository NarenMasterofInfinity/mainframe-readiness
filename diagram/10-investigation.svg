<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="849" viewBox="0 0 1220 849" role="img" aria-labelledby="title description" font-family="sans-serif">
<title id="title">From a blocker to its source</title>
<desc id="description">A planning lead can start from a gate. An analyst or architect can use the keyboard-accessible table to reach the same graph edges and source evidence. Participants: Reviewer (Human), Workbench (Machine), Graph (Machine), Evidence store (Machine). 1. Reviewer to Workbench: Open a gate, hotspot, component or entry point on a selected revision. 2. Workbench to Graph: Request dependencies, dependents or data handoff with direction and depth. 3. Graph to Graph: Visit each node once, exclude the root from counts and retain parallel edge evidence. 4. Graph to Graph: Bound depth and visits separately from the screen display limit. 5. Graph to Workbench: Return direct and indirect impact, example paths, affected entries and cap flags. If the result is large, disconnected or empty. 6. Workbench to Reviewer: Offer paging for visited rows, label lower bounds or explain the empty result. To check a displayed claim. 7. Reviewer to Workbench: Open the edge or select a behavior candidate or dictionary field. 8. Workbench to Evidence store: Look up the cited artifact digest, original spans and source version. 9. Evidence store to Workbench: Return verified physical lines, or a stale or unavailable locator. 10. Workbench to Reviewer: Show the stated fact, derivation, unknowns and a way back to the blocker.</desc>
