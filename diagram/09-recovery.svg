<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="871" viewBox="0 0 1220 871" role="img" aria-labelledby="title description" font-family="sans-serif">
<title id="title">Cancel, interrupt, reopen or retry</title>
<desc id="description">A retry creates its own attempt. A refresh simply reopens the existing run. An earlier committed result stays available. Participants: Analyst (Human), Workbench (Machine), Runner (Machine), Local store (Machine). View closes or refreshes while work is running. 1. Analyst to Workbench: Reopen the run. 2. Workbench to Local store: Read run ID, last committed stage and progress. 3. Workbench to Analyst: Restore current stage or already-published outcome. User cancels an active run before publication. 4. Analyst to Workbench: Cancel the selected run. 5. Workbench to Runner: Request cancellation at a safe boundary. 6. Runner to Local store: End as cancelled with diagnostics and discard incomplete staging. 7. Runner to Analyst: Return the terminal status. Process stops before commit. 8. Runner to Local store: On startup recover the last valid revision and mark interrupted work failed. 9. Workbench to Analyst: Show the saved receipt and failure stage. User retries a failed or cancelled attempt. 10. Analyst to Runner: Retry admission with a corrected selection, or reuse intact frozen bytes for publication. 11. Runner to Local store: Allocate a linked new run and fresh staging. 12. Runner to Workbench: Resume the applicable stages and publish only on success.</desc>
