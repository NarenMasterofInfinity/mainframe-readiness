<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1083" viewBox="0 0 1220 1083" role="img" aria-labelledby="title description" font-family="sans-serif">
<title id="title">Resolve names and assemble scoped flows</title>
<desc id="description">Read the batch and online branches independently. Both can occur in the same submission. Participants: Resolver (Machine), Evidence store (Machine), Graph (Machine). 1. Resolver to Evidence store: Request definitions, uses and explicit scope or binding evidence. 2. Evidence store to Resolver: Return eligible candidates and their source spans. Literal with one eligible target at the applicable priority. 3. Resolver to Graph: Link the reference to its target and preserve each occurrence. Several targets, no target, external declaration or dynamic operand. 4. Resolver to Graph: Keep ambiguous, missing, declared external, dynamic or unsupported status. Harbor Stock batch path. 5. Resolver to Graph: Bind step to program and match its logical file, DD and actual dataset. 6. Resolver to Graph: Attach supported operation direction separately for each job step. 7. Resolver to Graph: Derive a possible handoff from writer to reader of the same dataset. 8. Resolver to Graph: For two readers, record shared use only. Cedar Permits online path. 9. Resolver to Graph: Join the CSD transaction to its program, then to observed screen and table uses. 10. Resolver to Graph: Link an evidenced interface and expose a dynamic or missing target. Finish the graph. 11. Graph to Graph: Build stable entry paths, cycle-aware indices and boundary candidates. 12. Graph to Evidence store: Save batch, online, mixed or unknown workload with its evidence. 13. Graph to Evidence store: Save links with basis, scope, resolution and supporting evidence.</desc>
