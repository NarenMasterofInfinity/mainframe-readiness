<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1053" viewBox="0 0 1220 1053" role="img" aria-labelledby="title description" font-family="sans-serif">
<title id="title">Review a finding or close an evidence request</title>
<desc id="description">A domain expert can confirm or challenge a claim. The planning lead uses the reviewed gates when deciding whether to begin detailed planning. Participants: Domain expert (Human), Workbench (Machine), Review journal (Machine), Rubric (Machine), Planning lead (Human). 1. Domain expert to Workbench: Open the finding, both sides of a conflict or the requested evidence. 2. Domain expert to Workbench: Submit disposition, role, rationale, evidence and expected revision. 3. Workbench to Review journal: Validate subject fingerprint, evidence scope and revision. Stale revision, invalid source or insufficient rationale. 4. Review journal to Workbench: Return conflict or validation details without applying the event. 5. Workbench to Domain expert: Show the current revision so the expert can reconsider. Valid confirmation, correction, rejection, exclusion or retraction. 6. Review journal to Review journal: Append or supersede the event and preserve the original output. 7. Review journal to Rubric: Recompute affected interpretations, requirements and gates. 8. Rubric to Workbench: Return the reviewed projection with its new revision. Closing an action or accepting a risk. 9. Domain expert to Workbench: Record closure evidence or explain the accepted risk. 10. Workbench to Rubric: Evaluate the underlying criterion using its evidence and review. 11. Rubric to Workbench: Return the gate outcome, including still-open prerequisites. 12. Workbench to Planning lead: Present the reviewed answers, remaining blockers and action owners. 13. Planning lead to Planning lead: Decide whether to start detailed planning or seek more evidence.</desc>
