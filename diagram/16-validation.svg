<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="939" viewBox="0 0 1220 939" role="img" aria-labelledby="title description" font-family="sans-serif">
<title id="title">Extend the tool and verify the judge walkthrough</title>
<desc id="description">These team activities qualify the tool and its claims. They take place outside an analyst&#x27;s assessment run. Participants: Implementer (Human), Independent SME (Human), Local harness (Machine), Demo lead (Human). 1. Implementer to Local harness: Register an original analyzer or rule with its version and contract. 2. Implementer to Local harness: Supply a supported construct, a negative case and expected diagnostics. 3. Independent SME to Independent SME: Annotate held-out inputs, original spans and planning judgments independently. 4. Independent SME to Local harness: Make the reference key available for evaluation after methods are frozen. 5. Local harness to Local harness: Compare endpoints, resolution and source locations with explicit denominators. 6. Local harness to Local harness: Compare rubric conformance and independent usefulness judgments separately. If the optional model is eligible. 7. Implementer to Local harness: Select model settings on tuning cases and freeze the choice. 8. Local harness to Independent SME: Present held-out drafts for citation support, omissions and interpretation review. At the single delivery endpoint. 9. Demo lead to Local harness: Run Harbor, enrich it, then run Cedar with the same offline build. 10. Local harness to Demo lead: Return actual fields, prompt counts, timings, report paths and failures. 11. Demo lead to Demo lead: Trace a blocker to source by keyboard and open both formats offline. 12. Demo lead to Demo lead: Record proof and limitations, or leave failed checks open.</desc>
