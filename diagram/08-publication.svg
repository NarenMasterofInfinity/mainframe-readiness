<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="825" viewBox="0 0 1220 825" role="img" aria-labelledby="title description" font-family="sans-serif">
<title id="title">Publish the automatic report pair</title>
<desc id="description">Revision zero is the original machine assessment. A completed result becomes visible only when its snapshot and both default reports are available together. Participants: Runner (Machine), Exporter (Machine), Local store (Machine), Analyst (Human). 1. Runner to Exporter: Supply one run, one revision and all source-linked results. 2. Exporter to Exporter: Validate IDs and scope, escape supplied text and omit excerpts by default. 3. Exporter to Local store: Stage snapshot, report.html and report.json outside the input tree. Validation and writes succeed. 4. Local store to Local store: Atomically expose the complete set and mark the run completed. 5. Local store to Runner: Return run ID, revision and local paths. 6. Runner to Analyst: Open three answers, strongest drivers, first open question and next action. Admitted files yielded no usable observations. 7. Runner to Analyst: Show the same saved pair with inventory, unknowns and a replacement request. Validation or storage fails before commit. 8. Exporter to Runner: Return a publication diagnostic. 9. Runner to Local store: Keep the last valid publication and record a failed attempt. 10. Runner to Analyst: Show the failure stage and linked retry option.</desc>
