<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="937" viewBox="0 0 1220 937" role="img" aria-labelledby="title description" font-family="sans-serif">
<title id="title">Classify each admitted file</title>
<desc id="description">In a mixed export the inventory can show both batch and online clues. The business perimeter and completeness stay open until supported. Participants: Runner (Machine), Classifier (Machine), Reader (Machine), Local store (Machine). 1. Runner to Classifier: Inspect the bounded content sample, filename hints and permitted settings. For an expert-scoped child only. 2. Classifier to Local store: Record explicit exclusions or validated path overrides with their origin. For a supported type or decisive extensionless signature. 3. Classifier to Reader: Dispatch with detected kind and supported encoding or format. 4. Reader to Local store: Store original digest, logical path and map to physical lines. For conflicting cues, ambiguous layout, invalid encoding or unreadable member. 5. Classifier to Local store: Record candidates, diagnostic and any trustworthy coverage. For a nested archive, opaque binary or unrecognized format. 6. Classifier to Local store: Inventory as unsupported with its location and collection action. For identical content at distinct valid paths. 7. Classifier to Local store: Retain separate inventory identities and the common digest. Once all files have a disposition. 8. Runner to Local store: Save coverage totals, type clues and unreviewed business scope. 9. Runner to Runner: Continue even when every file is unsupported or excluded.</desc>
