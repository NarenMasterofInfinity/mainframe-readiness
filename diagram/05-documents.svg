<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="991" viewBox="0 0 1220 991" role="img" aria-labelledby="title description" font-family="sans-serif">
<title id="title">Read schedules, access, interfaces and operational notes</title>
<desc id="description">The first report uses the original files. A later reviewer can add an attributed interpretation of an unfamiliar source. Participants: Runner (Machine), Resource reader (Machine), Resolver (Machine), Evidence store (Machine). 1. Runner to Resource reader: Inspect the existing export with its physical row or line map. Scheduler CSV with recognized headings. 2. Resource reader to Resolver: Submit predecessor, successor and condition with the actual row. 3. Resolver to Evidence store: Record documented order for unique scoped jobs, or a validation gap. CICS resource definition or access command. 4. Resource reader to Resolver: Submit literal group, transaction and program, or profile, identity and access. 5. Resolver to Evidence store: Store definition or declared access with its scope and locator. Interface register. 6. Resource reader to Resolver: Submit named component, external party, direction and contract. 7. Resolver to Evidence store: Preserve supported declaration and flag incomplete or ambiguous contracts. Runbook, ownership note, audit note or test description. 8. Runner to Resource reader: Supply the indexed subject names after code discovery. 9. Resource reader to Evidence store: Attach a relevant paragraph as a review lead, or retain inventory alone. Malformed, unrelated or contradictory evidence. 10. Resource reader to Evidence store: Keep duplicate-header or malformed-row diagnostics and original locations. 11. Resolver to Evidence store: Preserve both comparable conflicting claims, or leave the requested evidence missing.</desc>
