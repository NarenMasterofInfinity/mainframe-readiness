<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="879" viewBox="0 0 1220 879" role="img" aria-labelledby="title description" font-family="sans-serif">
<title id="title">The assessment in one view</title>
<desc id="description">An analyst can stop at the saved report. Investigation, reassessment and a Tachyon brief are optional follow-ups. Participants: Analyst (Human), Workbench (Machine), Engine (Machine), Local store (Machine), Model (LLM). 1. Analyst to Workbench: Choose loose files, one folder or one ZIP. 2. Workbench to Engine: Start from the selection alone. 3. Engine to Local store: Freeze the admitted inputs and generated settings. 4. Engine to Engine: Extract evidence, resolve paths and evaluate three assessments. 5. Engine to Local store: Publish revision zero with HTML and JSON together. 6. Local store to Workbench: Return the completed run and both local paths. 7. Workbench to Analyst: Open the results, including blockers and next actions. Optional investigation after completion. 8. Analyst to Workbench: Inspect source, request review or select a flow for a brief. 9. Workbench to Model: Request a draft through the eligible offline Tachyon client. 10. Model to Workbench: Return a draft for citation checks and human review. Optional change of evidence or application. 11. Analyst to Workbench: Add evidence to this run or select another application. 12. Workbench to Engine: Start a linked child or an independent run through the same pipeline.</desc>
