<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="993" viewBox="0 0 1220 993" role="img" aria-labelledby="title description" font-family="sans-serif">
<title id="title">Read code and preserve its evidence</title>
<desc id="description">Repeat for each supported artifact. Each observation retains the source version, original path and all contributing physical spans. Participants: Runner (Machine), Source reader (Machine), Evidence store (Machine). 1. Runner to Source reader: Read supported statements from frozen bytes. 2. Source reader to Source reader: Handle fixed or free format, comments, strings and supported continuations. COBOL program or copybook. 3. Source reader to Evidence store: Emit program, literal CALL, dynamic operand and COPY occurrences. 4. Source reader to Evidence store: Record parent-qualified layouts and a bounded IF/MOVE candidate. 5. Source reader to Evidence store: Flag ELSE or nested branches as unsupported and keep includers distinct from field reads. 6. Source reader to Evidence store: Retain COPY cycles, substitutions and unsupported branches as limits. JCL job or procedure. 7. Source reader to Evidence store: Emit job, step, EXEC and scoped DD declarations. 8. Source reader to Source reader: Skip in-stream text and mark unsupported conditions or overrides. DDL, embedded SQL, CICS or BMS. 9. Source reader to Evidence store: Emit literal table accesses, program or map references and map definitions. 10. Source reader to Evidence store: Retain dynamic SQL and unknown operands for scoped resolution. If a reader fails partway. 11. Source reader to Evidence store: Commit independently trustworthy observations or discard uncommitted output. 12. Source reader to Runner: Report partial or failed coverage and advance to the next file.</desc>
