<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="829" viewBox="0 0 1220 829" role="img" aria-labelledby="title description" font-family="sans-serif">
<title id="title">Examine a proposed application boundary</title>
<desc id="description">The candidate starts from a discovered entry point. Crossings and shared writers explain why coupled components deserve investigation. Participants: Architect (Human), Workbench (Machine), Graph (Machine), Evidence store (Machine). 1. Architect to Workbench: Open the suggested group or choose another seed. 2. Workbench to Graph: Request bounded expansion on supported code links at this revision. 3. Graph to Workbench: Return proposed members, internal links, crossing edges and shortest paths. 4. Workbench to Architect: Show shared reads and writes, unresolved links, overlaps and traversal limits. 5. Architect to Workbench: Inspect a crossing edge and its ownership question. 6. Workbench to Evidence store: Retrieve scoped source evidence for both ends where available. 7. Evidence store to Architect: Show what supports the crossing and whether another writer is evidenced. If the architect explores an alternative. 8. Architect to Workbench: Add or remove members for comparison. 9. Workbench to Graph: Recompute crossings for that membership on the same graph. 10. Workbench to Evidence store: Preserve original and edited candidates with the review rationale. 11. Workbench to Architect: Display trade-offs and prerequisites for a planning decision.</desc>
