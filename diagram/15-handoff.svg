<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1017" viewBox="0 0 1220 1017" role="img" aria-labelledby="title description" font-family="sans-serif">
<title id="title">Read the reports and assess a second application</title>
<desc id="description">Opening the default reports takes no model, live workbench or network. The second application receives the same analyzer registry and rubric. Participants: Analyst (Human), Workbench (Machine), Local store (Machine), Report reader (Human). 1. Analyst to Report reader: Hand over the revision-pinned HTML and JSON paths. 2. Report reader to Local store: Read the selected pair with the workbench closed. 3. Local store to Report reader: Provide scope, results, graph, limitations, actions and evidence locators offline. If a reviewed or excerpt-enabled copy is requested. 4. Analyst to Workbench: Choose the run, revision, destination and inclusion settings. 5. Workbench to Local store: Validate and save that revision&#x27;s exports, preserving earlier pairs. 6. Workbench to Analyst: Return paths or a local write error with a retry option. For a new application. 7. Analyst to Workbench: Choose Cedar Permits resources in New assessment. 8. Workbench to Local store: Reserve a fresh application key even if the display name is reused. 9. Workbench to Workbench: Run the same files-to-results pipeline using only the new selection. 10. Workbench to Analyst: Open Cedar&#x27;s transaction, program, table and remaining access question. 11. Analyst to Workbench: Compare Cedar and Harbor in the application list. 12. Workbench to Local store: Load the two selected revisions, scopes, coverage and rubric versions. 13. Workbench to Report reader: Show separate assessments and drill-downs, with method differences visible.</desc>
