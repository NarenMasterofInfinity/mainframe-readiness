<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1049" viewBox="0 0 1220 1049" role="img" aria-labelledby="title description" font-family="sans-serif">
<title id="title">Ask Tachyon for an optional modernization brief</title>
<desc id="description">The initial report already exists. A useful proposal might ask how a partial stock-file write is reconciled after restart. The schedule evidence by itself cannot answer that question. Participants: Reviewer (Human), Workbench (Machine), Evidence store (Machine), Tachyon client (Machine), Model (LLM). 1. Reviewer to Workbench: Select a completed flow and request a brief. Unavailable, ineligible or requires a network call. 2. Workbench to Reviewer: Explain that the brief is unavailable and offer the existing evidence-linked summary. Eligible offline client and model. 3. Workbench to Evidence store: Fetch selected path, definitions, evidence IDs, limitations and open questions. 4. Evidence store to Workbench: Return scoped material and flag omitted or truncated context. 5. Workbench to Tachyon client: Send bounded context, structured output request and supported settings. 6. Tachyon client to Model: Invoke the eligible model using chat completions semantics. 7. Model to Tachyon client: Draft candidate behavior, implications, questions and cited premises. 8. Tachyon client to Workbench: Return the draft or a timeout, unavailable-model or invocation error. If the request fails, format is invalid or a citation is missing. 9. Workbench to Reviewer: Show the failure or unsupported claim as such, with the saved report available. If structural and citation checks pass. 10. Workbench to Evidence store: Record draft provenance, settings, supplied IDs and truncation. 11. Workbench to Reviewer: Display the draft beside the actual evidence and remaining uncertainty. 12. Reviewer to Workbench: Check meaning and confirm, correct or leave the candidate open. 13. Workbench to Evidence store: Save the disposition as draft review history.</desc>
