<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1109" viewBox="0 0 1220 1109" role="img" aria-labelledby="title description" font-family="sans-serif">
<title id="title">Calculate three separate answers</title>
<desc id="description">The rubric covers code and business logic, data, batch, transactions and UI, integrations, security, and operations. A complete report can legitimately say More evidence required. Participants: Rubric (Machine), Evidence store (Machine), Gap planner (Machine), Report model (Machine). 1. Rubric to Evidence store: Read scoped signals, coverage, unresolved items and active reviews. Complexity for each applicable dimension. 2. Rubric to Report model: Record the strongest supported band and the rule or missing prerequisite. 3. Rubric to Report model: Qualify partial coverage and distinguish Unknown, reviewed Low and reviewed exclusions. 4. Rubric to Report model: Return the highest demonstrated overall signal and carry forward uncertainty. Confidence for each applicable dimension. 5. Rubric to Rubric: Check availability, extraction, resolution and independent review. 6. Rubric to Report model: Report passed and applicable counts, band, unknowns and limits. 7. Rubric to Report model: Use the lowest known applicable band and flag unresolved dimensions. Readiness for critical subjects. 8. Rubric to Rubric: Evaluate scope, dependencies, business and data, operations, security and interfaces, and review. 9. Rubric to Report model: Any failed gate gives Not ready, else an unknown gives More evidence required. 10. Rubric to Report model: All applicable gates pass gives Ready for detailed planning. Recommendations for the resulting evidence state. 11. Rubric to Gap planner: Supply supported risks, gaps, contradictions and affected entries. 12. Gap planner to Report model: Rank blockers, then material investigations, with reason, owner role and closure evidence. 13. Gap planner to Report model: Attach conditional planning considerations and the assumptions to check.</desc>
