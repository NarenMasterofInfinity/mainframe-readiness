<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1065" viewBox="0 0 1220 1065" role="img" aria-labelledby="title description" font-family="sans-serif">
<title id="title">Select and admit the resources</title>
<desc id="description">The receipt explains a structural rejection. A regular file that cannot be interpreted is handled during discovery, so other usable files can still contribute. Participants: Analyst (Human), Picker or CLI (Machine), Runner (Machine), Local store (Machine). 1. Analyst to Picker or CLI: Commit one selection, with zero metadata fields. 2. Picker or CLI to Runner: Submit local handles and a submission token. If the same submission event arrives twice. 3. Runner to Local store: Look up the original token and run. 4. Runner to Picker or CLI: Return that run and its progress, then stop this duplicate request. If a different run already owns the workspace writer. 5. Runner to Picker or CLI: Surface the active run and allow a new submission after it finishes. For a new assessment when the writer is available. 6. Runner to Local store: Reserve run identity and the sole workspace writer. 7. Runner to Runner: Enumerate selected paths and normalize one enclosing archive wrapper. 8. Runner to Runner: Check path containment, collisions, member types and declared sizes. 9. Runner to Runner: Stream bytes into staging, enforce actual limits and hash readable members. If empty, unsafe, encrypted, malformed, colliding or over the limit. 10. Runner to Local store: Retain a failure receipt and discard incomplete staging. 11. Runner to Analyst: Show the reason and a remedy, such as selecting the containing folder. If admitted. 12. Runner to Local store: Freeze paths, bytes, limits and the supplied-file perimeter. 13. Runner to Picker or CLI: Expose inventory progress and continue automatically.</desc>
