<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1049" viewBox="0 0 1220 1049" role="img" aria-labelledby="title description" font-family="sans-serif">
<title id="title">Add evidence and compare two runs</title>
<desc id="description">Harbor Stock&#x27;s schedule file can settle the documented order while the restart question stays open. Additional evidence can also reveal a new risk. Participants: Analyst (Human), Workbench (Machine), Runner (Machine), Local store (Machine), Comparison (Machine). 1. Analyst to Workbench: From the completed base choose Add evidence and select the schedule CSV. Advanced alternative. 2. Analyst to Workbench: Correct a path setting or explicitly select a same-path replacement. 3. Workbench to Workbench: Validate settings and return any field errors to the analyst. For a valid child submission. 4. Workbench to Runner: Submit the parent and selected change. 5. Runner to Local store: Allocate a child under the same application and freeze the combined inputs. 6. Runner to Runner: Rerun extraction, resolution and rubric with a fresh review state. 7. Runner to Local store: Publish the child&#x27;s independent snapshot, HTML and JSON. 8. Runner to Comparison: Compare base and child at explicit revisions using stable subject keys. Relevant scheduler row with matched jobs. 9. Comparison to Workbench: Show the new row and changed schedule coverage while recovery remains open. Unrelated row, conflict, missing job or changed methodology. 10. Comparison to Workbench: Show unchanged checks, new gaps or mixed causes with version caveats. 11. Workbench to Analyst: Open either run, its actual bands, source changes and remaining actions. If optional isolated preview is implemented. 12. Analyst to Workbench: Keep a staged child or discard that preview while preserving the base.</desc>
