<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="753" viewBox="0 0 1220 753" role="img" aria-labelledby="title description" font-family="sans-serif">
<title id="title">One-time environment decision</title>
<desc id="description">This is the implementation team&#x27;s setup. The analyst encounters the resource picker when the workbench is installed in a permitted environment. Participants: Build lead (Human), Local host (Machine), QA reviewer (Human), Workbench (Machine). 1. Build lead to Local host: Inspect the exact host, runtime, build, UI and storage components. 2. Build lead to Build lead: Record the permitted boundary and component origins. If a compatible host is established. 3. Build lead to Local host: Select one eligible store and install first-party assets. 4. QA reviewer to Workbench: Exercise picker, CLI and reports with network access denied. 5. Workbench to QA reviewer: Return local results and recorded attempts for inspection. 6. QA reviewer to Build lead: Record setup and offline evidence for the demo. If the boundary is unresolved. 7. Build lead to Build lead: Keep executable delivery open and continue original fixture and contract work. Independent model eligibility decision. 8. Build lead to Workbench: Leave the brief disabled unless client, model and transport meet all restrictions.</desc>
