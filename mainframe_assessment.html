function dependencies(){let id=state.selected,a=byId[id];let usable=edges.filter(e=>state.graphKind==='All'||(state.graphKind==='Calls'&&['CALL','EXEC','PROC','DYNAMIC CALL'].includes(e.kind))||(state.graphKind==='Data'&&['READ','WRITE','DD'].includes(e.kind))||(state.graphKind==='Copybooks'&&e.kind==='COPY'));let left=new Set(),right=new Set(),front=[id];for(let d=0;d<Number(state.graphDepth);d++){let next=[];for(let n of front){if(state.graphDir!=='Outgoing')for(let x of usable.filter(e=>e.to===n)){if(x.from!==id&&!left.has(x.from)){left.add(x.from);next.push(x.from)}}if(state.graphDir!=='Incoming')for(let x of usable.filter(e=>e.from===n)){if(x.to!==id&&!right.has(x.to)){right.add(x.to);next.push(x.to)}}}front=uniq(next)}let up=[...left].slice(0,10),down=[...right].filter(x=>!up.includes(x)).slice(0,10),nodes=[id,...up,...down],es=usable.filter(e=>nodes.includes(e.from)&&nodes.includes(e.to)),pos={[id]:[400,190]};distribute(up,55,pos);distribute(down,270,pos);let all=usable.filter(e=>e.from===id||e.to===id);return head('Dependency explorer','Explore program, job and data dependencies, and trace every edge to source evidence.',htmlBtn('Export relationships','export-edges'))+`<div class="toolbar"><label>Focus ${sel('selected',assets.map(a=>a.id),id,'focus asset')}</label><label>Depth ${sel('graphDepth',['1','2','3'],String(state.graphDepth),'depth')}</label>${sel('graphDir',['Both','Incoming','Outgoing'],state.graphDir,'direction')}${sel('graphKind',['All','Calls','Data','Copybooks'],state.graphKind,'relationships')}${htmlBtn('Show cycle','cycle')}</div><div class="grid wide"><div class="card"><div class="minicards" style="grid-template-columns:repeat(3,1fr);margin-top:0"><div><b>${assets.length}</b><span class="small">Assets</span></div><div><b>${edges.length}</b><span class="small">References</span></div><div><b>${nodes.length}</b><span class="small">Visible nodes</span></div></div><div class="graph">${graphSvg(nodes,es,pos,id)}${graphControls()}</div><div class= function complexity(){let list=programs.filter(a=>state.complex==='All'||cls(a)===state.complex);let counts=classes.map(c=>measured.filter(a=>cls(a)===c).length);let scatter=`<svg class="scatter" viewBox="0 0 420 240" aria-label="Complexity versus normalized degree"><g stroke="#e0e5ed" stroke-width="1">${[0,.25,.5,.75,1].map(v=>`<path d="M48 ${205-v*175}H405"/>`).join('')}${[0,250,500,750,1000,1250].map(v=>`<path d="M${48+v/1250*350} 30V205"/>`).join('')}</g><path d="M48 25V205H405" stroke="#8b95a4" fill="none"/>${[0,.25,.5,.75,1].map(v=>`<text x="40" y="${209-v*175}" text-anchor="end" font-size="10" fill="#667">${v}</text>`).join('')}${[0,250,500,750,1000,1250].map(v=>`<text x="${48+v/1250*350}" y="220" text-anchor="middle" font-size="10" fill="#667">${v}</text>`).join('')}<text x="225" y="236" text-anchor="middle" font-size="10" fill="#667">McCabe complexity</text><text transform="translate(12 118) rotate(-90)" text-anchor="middle" font-size="10" fill="#667">Normalized degree</text>${measured.map(a=>`<circle tabindex="0" role="button" data-do="asset" data-id="${a.id}" cx="${48+a.cc/1250*350}" cy="${205-central(a)*175}" r="${a.id==='PAYMENT'?6:4.5}" fill="${classColor[classes.indexOf(cls(a))]}" stroke="#fff"><title>${a.id}: ${a.cc} / ${central(a).toFixed(2)}</title></circle>`).join('')}</svg>`;return head('Complexity and migration risk','Identify difficult-to-modernize programs and distinguish complexity from dependency risk.',htmlBtn('Export metrics','export-complex'))+`<div class="grid g4">${classes.map((c,i)=>`<div class="card groupcard" role="button" tabindex="0" data-do="complex-filter" data-id="${c}" style="border-top:4px solid ${classColor[i]}"><div>${c}</div><strong style="font-size:28px;display:block;margin:8px 0">${counts[i]}</strong><span class="small">${percent(counts[i],measured.length)}% of measured programs</span></div>`).join('')}</div><div class="grid triple"><div class="card"><h2>Program complexity distribution</h2><div class="treemap">${classes.m function closeDrawer(){$('#overlay').classList.add('hide')}
function evidence(x){drawer('Relationship evidence',`${x.from} → ${x.to}`,`<div class="metriclist"><div><span>Relationship</span>${tag(x.kind,'grey')}</div><div><span>Resolution</span>${tag(x.resolved?'Resolved':'Unresolved',x.resolved?'green':'red')}</div><div><span>Source</span>${assetLink(x.from)}</div><div><span>Target</span>${assetLink(x.to)}</div><div><span>Source line</span><b>${x.line}</b></div></div><h3>Source statement</h3>${snippet(x.from,x.line,x.stmt)}<h3>Rule that created this edge</h3><div class="rulebox">${esc(({CALL:'Resolve literal CALL target against program symbols.','DYNAMIC CALL':'Variable target: preserve unresolved reference until runtime mapping is provided.',EXEC:'Extract PGM from a JCL EXEC step.',COPY:'Resolve COPY member using copybook search paths.',READ:'Read operation mapped to its physical dataset or table.',WRITE:'Write or mutation mapped to its physical dataset or table.',DD:'DD DSN allocation; not evidence of read/write.',PROC:'Resolve JCL procedure reference.',MAP:'Resolve CICS map name against BMS symbols.'})[x.kind]||x.kind)}</div><div style="margin-top:18px">${htmlBtn('Open source asset','asset',`data-id="${x.from}"`,'primary')}</div>`)}
function ruleDetail(r){drawer(r.id+' · '+r.name,r.domain+' · '+r.asset,`<div class="metriclist"><div><span>Review status</span>${tag(r.status)}</div><div><span>Origin</span><b>Sample extracted rule</b></div></div><h3>Condition</h3><div class="rulebox"><code>${esc(r.condition)}</code></div><h3>Resulting action</h3><p>${esc(r.action)}</p><h3>Source evidence</h3>${snippet(r.asset,r.line,`IF ${r.condition}`)}<div class="callout info">This is a synthetic rule candidate. Confirm only after checking the complete source in a real assessment.</div><div class="actions">${htmlBtn('Confirm rule','review-rule',`data-id="${r.id}" data-val="Confirmed"`,'primary')}${htmlBtn('Reject rule','review-rule',`data-id="${r.id}" data-val="Rejected"`)}${htmlBtn('Reset review','review-rule',`data-id="${r.id}" data-val="Candidate"`)}</div>`)}
function groupDetail(d){let a=assets.filter(x=>x.domain===d),es=resolved.filter(e=>byId[e.from].domain===d&&byId[e.to].domain!==d),u=unresolved.filter(e=>byId[e.from].domain===d);drawer(d,'Candidate migration group',`<div class="minicards"><div><b>${a.length}</b><span class="small">Assets</span></div><div><b>${groupScore(d)}</b><span class="small">Group indicator / 100</span></div></div><h3>External prerequisites</h3>${edgeTable(es)}<h3>Unresolved references</h3>${edgeTable(u)}<h3>Migration gates</h3><div class="rulebox">Resolve ${u.length} unresolved outgoing references; review ${es.length} cross-domain references; validate shared writes and integration tests before cutover.</div><div style="margin-top:15px">${htmlBtn('Inspect group assets','domain',`data-id="${d}"`,'primary')}</div>`)}
function download(name,body,type='text/csv'){let blob=new Blob([body],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Export prepared: '+name)}function csv(rows){return rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}
let toastTimer;function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hide'),2800)}
function ask(){drawer('Analysis assistant','Local demonstration · no LLM connected',`<p>Choose a question to get a deterministic answer from the sample assessment.</p><div class="searchresults" style="margin:16px 0">${[['blockers','What should I fix first?'],['payment','Why is PAYMENT high risk?'],['data','Which datasets have multiple writers?'],['cycle','What are the cyclic dependencies?']].map(([id,q])=>htmlBtn(q,'ask-answer',`data-id="${id}"`)).join('')}</div><div id="answer" class="rulebox">Choose a question above.</div>`)}
function act(el){let k=el.dataset.do,id=el.dataset.id,v=el.dataset.val;switch(k){case 'nav':navigate(id);break;case 'asset':state.selected=id;state.assetTab='Overview';navigate('assets');break;case 'tab':state[el.dataset.field]=v;render();break;case 'finding':{let f=findings[+id];if(f.route==='diagnostics')state.diag=f.filter;if(f.route==='complexity')state.complex=f.filter;if(f.route==='lineage')state.dataset=f.filter;if(f.route==='dependencies'){state.selected=cycles[0]?.[0]||'ACCOUNT';state.graphKind='Calls';state.graphDepth=1}navigate(f.route);break}case 'sort':state.asc=state.sort===id?!state.asc:true;state.sort=id;render();break;case 'prev':state.pageNo--;render();break;case 'next':state.pageNo++;render();break;case 'clear-inventory':Object.assign(state,{q:'',type:'All',domain:'All',status:'All',pageNo:1});render();break;case 'inv-type':state.type=state.type===id?'All':id;state.pageNo=1;render();break;case 'graph-node':if(byId[id]){state.selected=id;state.zoom=1;render()}else act({dataset:{do:'missing',id}});break;case 'focus-graph':state.selected=id;state.graphKind='All';navigate('dependencies');break;case 'cycle':state.selected=cycles[0]?.[0]||'ACCOUNT';state.graphKind='Calls';state.graphDir='Both';state.graphDepth=1;render();toast('Focused on '+(cycles[0]||[]).join(' ↔ '));break;case 'zoom':state.zoom=id==='reset'?1:Math.max(.6,Math.min(2.5,state.zoom+(id==='in'?.2:-.2)));render();break;case 'dataset':state.dataset=id;state.zoom=1;render();break;case 'edge':evidence(edges[+id]);break;case 'all-edges':drawer('All relationships',edges.length+' references in the fixture',edgeTable(edges));break;case 'missing':drawer('Unresolved target',id,`<div class="callout danger">No matching asset found in the sample inventory.</div>${edgeTable(incoming(id))}`);break;case 'complex-filter':state.complex=state.complex===id?'All':id;render();break;case 'domain':Object.assign(state,{q:'',type:'All',status:'All',domain:id,pageNo:1});navigate('inventory');break;case 'rule':ruleDetail(sampleRules.find(x=>x.id===id));break;case 'review-rule':{let r=sampleRules.find(x=>x.id===id);r.status=v;render();ruleDetail(r);toast('Rule review updated');break}case 'group':groupDetail(id);break;case 'method':{let [t,s]=methods[state.page];drawer(t,'Population rules · proposed implementation',`<p>${esc(s)}</p>${state.page==='dashboard'?`<h3>Readiness score breakdown</h3>${table(['Component','Weight','Value'],subscores.map(([l,w,n])=>[l,w+'%',n]))}<h3>Approval gates</h3><div class="rulebox">Unresolved references, failed parses and shared data require separate review; do not infer readiness from the score alone.</div>`:''}<h3>Assessment pipeline</h3><div class="rulebox">Source files → language detection → parser / AST → symbol resolution → dependency graph → metrics and rules → UI views. Optional AI enriches interpretation, not evidence.</div>`);break}case 'close':closeDrawer();break;case 'ask':ask();break;case 'ask-answer':{let t={blockers:`Resolve ${missingCopy.length} missing copybooks and ${unknownCalls.length} missing modules; then validate dynamic calls and partial parses.`,payment:`PAYMENT has McCabe complexity ${byId.PAYMENT.cc}, degree ${central(byId.PAYMENT).toFixed(2)} and ${outgoing('PAYMENT').filter(x=>!x.resolved).length} unresolved outgoing reference(s). Review tests and coupling before migration.`,data:`Multiple writers: ${shared.map(a=>a.id).join(', ')}. Define data ownership and cutover strategy.`,cycle:`Detected call cycles: ${cycles.map(g=>g.join(' ↔ ')).join('; ')}. Group the components or break the cycle.`}[id];$('#answer').textContent=t;break}case 'rerun':state.runCount++;state.dashTab='Execution log';render();toast('Sample assessment recomputed (fixture unchanged)');break;case 'report':download('assessment-report.json',JSON.stringify({prototype:true,assets,edges,readiness,subscores,findings,cycles},null,2),'application/json');break;case 'export-inventory':download('inventory.csv',csv([['Asset','Technology','LOC','Status','Domain'],...assets.filter(a=>(state.type==='All'||a.type===state.type)&&(state.domain==='All'||a.domain===state.domain)&&(state.status==='All'||a.status===state.status)&&`${a.name} ${a.domain} ${a.kind}`.toLowerCase().includes(state.q.toLowerCase())).map(a=>[a.name,a.type,a.loc,a.status,a.domain])]));break;case 'export-edges':case 'export-lineage':download(k==='export-lineage'?'data-lineage.csv':'dependencies.csv',csv([['Source','Target','Kind','Resolved','Statement','Line'],...(k==='export-lineage'?incoming(state.dataset):edges).map(x=>[x.from,x.to,x.kind,x.resolved,x.stmt,x.line])]));break;case 'export-complex':download('complexity.csv',csv([['Program','LOC','McCabe','Degree','Risk'],...programs.filter(a=>state.complex==='All'||cls(a)===state.complex).map(a=>[a.name,a.loc,a.cc,central(a).toFixed(2),risk(a)])]));break;case 'export-diag':download('diagnostics.csv',csv([['Type','Severity','Asset','Detail','Line'],...diagnostics.filter(d=>state.diag==='All'||d.type===state.diag).map(d=>[d.type,d.severity,d.asset,d.detail,d.line])]));break;case 'export-roadmap':download('roadmap.json',JSON.stringify({prototype:true,conditional:true,order:['Foundation','Customer core','Payments','Reporting'],readiness,cycles,shared:shared.map(a=>a.id),findings},null,2),'application/json');break}}
document.addEventListener('click',e=>{let el=e.target.closest('[data-do]');if(el){e.preventDefault();act(el)}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();let el=e.target.closest('[data-do]');if(el&&el.tagName.toLowerCase()!=='button'&&['Enter',' '].includes(e.key)){e.preventDefault();act(el)}});document.addEventListener('change',e=>{let el=e.target,field=el.dataset.field;if(!field)return;state[field]=el.type==='checkbox'?el.checked:field==='pageSize'?+el.value:el.value;state.pageNo=1;state.zoom=1;render()});document.addEventListener('input',e=>{if(e.target.id==='query'){let pos=e.target.selectionStart;state.q=e.target.value;state.pageNo=1;render();let q=$('#query');q.focus();q.setSelectionRange(pos,pos)} });$('#global').addEventListener('keydown',e=>{if(e.key==='Enter'){Object.assign(state,{q:e.target.value,type:'All',domain:'All',status:'All',pageNo:1});navigate('inventory')}});$('#menu').onclick=()=>$('#nav').classList.toggle('open');let initial=location.hash.slice(1);if(navs.some(x=>x[1]===initial))state.page=initial;render();
</script></body></html>
